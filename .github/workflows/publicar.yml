name: Publicar o site (GitHub Pages)

# Publica a cada mudança na branch main e depois de cada atualização dos dados de mercado.
# (O commit feito pela rotina de mercado não dispara "push" sozinho; por isso o workflow_run.)
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Atualizar dados de mercado (BCB)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testes dos motores
        run: npm test
      - name: Build (checagem de tipos + site estático)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
