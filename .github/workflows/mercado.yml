name: Atualizar dados de mercado (BCB)

on:
  schedule:
    - cron: '30 11 * * 1-5' # 08:30 em Brasília, dias úteis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar SGS e Focus
        run: node scripts/atualizar-mercado.mjs
      - name: Gravar se mudou
        run: |
          if git diff --quiet public/dados/mercado.json; then
            echo "Sem mudança nos dados de mercado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dados/mercado.json
          git commit -m "Dados de mercado do BCB: $(date -u +%Y-%m-%d)"
          git push
